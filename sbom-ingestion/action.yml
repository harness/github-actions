name: 'SBOM Ingestion'
description: 'Github action to generate SBOM for a given artifact'
author: 'Reetika Mallavarapu'
inputs:
  HARNESS_ACCOUNT_URL:
    description: 'Harness Account Url'
    required: true
  HARNESS_ACCOUNT_ID:
    description: 'Harness Account ID'
    required: true
  HARNESS_ORG_ID:
    description: 'Harness Organization ID'
    required: true
  HARNESS_PROJECT_ID:
    description: 'Harness Project ID'
    required: true
  HARNESS_API_KEY:
    description: 'Auth token for authentication with Harness'
    required: true
  TARGET:
    description: 'Image or repo source (maps to SBOM_SOURCE for the plugin)'
    required: true
  SBOM_FILE_PATH:
    description: 'SBOM file path'
    required: true
  ATTEST:
    description: 'If attestation is required'
    required: false
    default: 'false'
  KMS_KEY:
    description: 'Kms Key'
    required: false
  VAULT_ADDR:
    required: false
  VAULT_TOKEN:
    required: false
  OIDC_PROVIDER:
    required: false
  PLUGIN_IMAGE:
    default: 'harness/ssca-plugin:0.69.0'
    required: false
  SOURCE_TYPE:
    default: 'docker'
    required: false
  DOCKER_USERNAME:
    required: false
  DOCKER_PASSWORD:
    required: false
runs:
  using: 'composite'
  steps:
    - name: SBOM Ingestion
      shell: bash
      env:
        ACTION_NAME: 'SBOM Ingestion'
        HARNESS_ACCOUNT_URL: ${{ inputs.HARNESS_ACCOUNT_URL }}
        HARNESS_ACCOUNT_ID: ${{ inputs.HARNESS_ACCOUNT_ID }}
        HARNESS_ORG_ID: ${{ inputs.HARNESS_ORG_ID }}
        HARNESS_PROJECT_ID: ${{ inputs.HARNESS_PROJECT_ID }}
        HARNESS_API_KEY: ${{ inputs.HARNESS_API_KEY }}
        SBOM_SOURCE: ${{ inputs.TARGET }}
        SBOM_FILE_PATH: ${{ inputs.SBOM_FILE_PATH }}
        PLUGIN_SBOMDESTINATION: ${{ inputs.SBOM_FILE_PATH }}
        PLUGIN_TYPE: 'github-orchestrate'
        SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
        PLUGIN_MODE: 'ingestion'
        ATTEST_SBOM: ${{ inputs.ATTEST }}
        KMS_KEY: ${{ inputs.KMS_KEY }}
        VAULT_ADDR: ${{ inputs.VAULT_ADDR }}
        VAULT_TOKEN: ${{ inputs.VAULT_TOKEN }}
        OIDC_PROVIDER: ${{ inputs.OIDC_PROVIDER }}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
      run: |
        set -euo pipefail
        if [ "${OIDC_PROVIDER:-}" = "non-harness" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "keyless signing requires permissions id-token write in the calling workflow" >&2
            exit 1
          fi
          PLUGIN_NON_HARNESS_OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=harness-fulcio" | jq -r '.value')"
          export PLUGIN_NON_HARNESS_OIDC_TOKEN
        fi
        PLUGIN_IMAGE="${{ inputs.PLUGIN_IMAGE }}"
        ENV_FILE="$(mktemp)"
        env | grep -E '^(HARNESS_|GITHUB_|SBOM_|SBOM_FILE|SOURCE_|PLUGIN_|SSCA_|VAULT_|DOCKER_|ATTEST_|REPO_|REGISTRY_|KMS_|ARTIFACT_|OIDC_|FULCIO_)' > "$ENV_FILE" || true
        if [ -n "${PLUGIN_NON_HARNESS_OIDC_TOKEN:-}" ]; then
          echo "PLUGIN_NON_HARNESS_OIDC_TOKEN=${PLUGIN_NON_HARNESS_OIDC_TOKEN}" >> "$ENV_FILE"
        fi
        DOCKER_SOCK_MOUNT=()
        case "${SOURCE_TYPE:-docker}" in
          docker|image) DOCKER_SOCK_MOUNT=(-v /var/run/docker.sock:/var/run/docker.sock) ;;
        esac
        docker run --rm \
          "${DOCKER_SOCK_MOUNT[@]}" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -w "${GITHUB_WORKSPACE}" \
          --env-file "$ENV_FILE" \
          --entrypoint /bin/ssca-plugin \
          "$PLUGIN_IMAGE" \
          github-orchestrate
