name: 'SBOM Generation'
description: 'Github action to generate SBOM for a given artifact'
author: 'Reetika Mallavarapu'
inputs:
  HARNESS_ACCOUNT_URL:
    description: 'Harness Account Url'
    required: true
  HARNESS_ACCOUNT_ID:
    description: 'Harness Account ID'
    required: true
  HARNESS_ORG_ID:
    description: 'Harness Organization ID'
    required: true
  HARNESS_PROJECT_ID:
    description: 'Harness Project ID'
    required: true
  HARNESS_API_KEY:
    description: 'Auth token for authentication with Harness'
    required: true
  SBOM_TOOL:
    description: 'Tool which needs to be orchestrated (e.g., Syft, Blackduck)'
    required: true
  SBOM_FORMAT:
    description: 'Format of SBOM to be generated by plugin tool (e.g., SPDX, CYCLONEDX)'
    required: true
  SOURCE_TYPE:
    description: 'Source or registry type: docker, acr, gcr, ecr, gar, har, local, repository. Default docker.'
    required: false
    default: 'docker'
  SBOM_SOURCE:
    description: 'Image, file path, or repo identifier.'
    required: false
  PLUGIN_SBOMDESTINATION:
    description: 'Directory or path for generated SBOM output (PLUGIN_SBOMDESTINATION).'
    required: false
  ATTEST_SBOM:
    description: 'If attestation is required'
    required: false
    default: 'false'
  KMS_KEY:
    required: false
  VAULT_ADDR:
    required: false
  VAULT_TOKEN:
    required: false
  OIDC_PROVIDER:
    description: 'Set to non-harness for GitHub OIDC keyless signing (audience harness-fulcio)'
    required: false
  ARTIFACT_WORKSPACE:
    description: 'Workspace path for non-container/local artifacts (ARTIFACT_WORKSPACE).'
    required: false
  ARTIFACT_NAME:
    required: false
  ARTIFACT_VERSION:
    required: false
  DOCKER_USERNAME:
    required: false
  DOCKER_PASSWORD:
    required: false
runs:
  using: 'composite'
  steps:
    - name: SBOM Generation
      uses: ./run-plugin-container
      env:
        ACTION_NAME: 'SBOM Generation'
        HARNESS_ACCOUNT_URL: ${{ inputs.HARNESS_ACCOUNT_URL }}
        HARNESS_ACCOUNT_ID: ${{ inputs.HARNESS_ACCOUNT_ID }}
        HARNESS_ORG_ID: ${{ inputs.HARNESS_ORG_ID }}
        HARNESS_PROJECT_ID: ${{ inputs.HARNESS_PROJECT_ID }}
        HARNESS_API_KEY: ${{ inputs.HARNESS_API_KEY }}
        SBOM_TOOL: ${{ inputs.SBOM_TOOL }}
        SBOM_FORMAT: ${{ inputs.SBOM_FORMAT }}
        SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
        SBOM_SOURCE: ${{ inputs.SBOM_SOURCE }}
        PLUGIN_SBOMDESTINATION: ${{ inputs.PLUGIN_SBOMDESTINATION }}
        PLUGIN_MODE: 'generation'
        ATTEST_SBOM: ${{ inputs.ATTEST_SBOM }}
        KMS_KEY: ${{ inputs.KMS_KEY }}
        VAULT_ADDR: ${{ inputs.VAULT_ADDR }}
        VAULT_TOKEN: ${{ inputs.VAULT_TOKEN }}
        OIDC_PROVIDER: ${{ inputs.OIDC_PROVIDER }}
        ARTIFACT_WORKSPACE: ${{ inputs.ARTIFACT_WORKSPACE }}
        ARTIFACT_NAME: ${{ inputs.ARTIFACT_NAME }}
        ARTIFACT_VERSION: ${{ inputs.ARTIFACT_VERSION }}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
      with:
        PLUGIN_IMAGE: harness/ssca-plugin:0.69.0
        ENTRYPOINT: /bin/ssca-plugin
        COMMAND: github-orchestrate
