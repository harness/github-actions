name: 'SLSA Provenance Generation'
description: 'Github action to generate SLSA for a given artifact'
author: 'Reetika Mallavarapu'
inputs:
  HARNESS_ACCOUNT_URL:
    description: 'Harness Account Url'
    required: true
  HARNESS_ACCOUNT_ID:
    description: 'Harness Account ID'
    required: true
  HARNESS_ORG_ID:
    description: 'Harness Organization ID'
    required: true
  HARNESS_PROJECT_ID:
    description: 'Harness Project ID'
    required: true
  HARNESS_API_KEY:
    description: 'Auth token for authentication with Harness'
    required: true
  SLSA_SOURCE:
    description: 'Image or repo source'
    required: true
  ATTEST_SLSA:
    description: 'If attestation is required'
    required: false
    default: 'false'
  KMS_KEY:
    description: 'Kms Key'
    required: false
  VAULT_ADDR:
    required: false
  VAULT_TOKEN:
    required: false
  OIDC_PROVIDER:
    required: false
  PLUGIN_IMAGE:
    default: 'harness/slsa-plugin:0.69.0'
    required: false
  SOURCE_TYPE:
    default: 'docker'
    required: false
  DOCKER_USERNAME:
    required: false
  DOCKER_PASSWORD:
    required: false
runs:
  using: 'composite'
  steps:
    - name: SLSA Provenance Generation
      uses: ./run-plugin-container
      env:
        ACTION_NAME: 'SLSA Provenance Generation'
        HARNESS_ACCOUNT_URL: ${{ inputs.HARNESS_ACCOUNT_URL }}
        HARNESS_ACCOUNT_ID: ${{ inputs.HARNESS_ACCOUNT_ID }}
        HARNESS_ORG_ID: ${{ inputs.HARNESS_ORG_ID }}
        HARNESS_PROJECT_ID: ${{ inputs.HARNESS_PROJECT_ID }}
        HARNESS_API_KEY: ${{ inputs.HARNESS_API_KEY }}
        SLSA_SOURCE: ${{ inputs.SLSA_SOURCE }}
        PLUGIN_TYPE: 'github-provenance'
        ATTEST_SLSA: ${{ inputs.ATTEST_SLSA }}
        KMS_KEY: ${{ inputs.KMS_KEY }}
        VAULT_ADDR: ${{ inputs.VAULT_ADDR }}
        VAULT_TOKEN: ${{ inputs.VAULT_TOKEN }}
        OIDC_PROVIDER: ${{ inputs.OIDC_PROVIDER }}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
      with:
        PLUGIN_IMAGE: ${{ inputs.PLUGIN_IMAGE }}
        ENTRYPOINT: /bin/slsa-plugin
        COMMAND: github-provenance
        SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
