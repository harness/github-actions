name: 'Run plugin container'
description: 'Internal composite — GitHub OIDC keyless token and docker run for Harness SSCA plugins'
inputs:
  plugin_image:
    required: true
  entrypoint:
    required: true
  command:
    required: true
  source_type:
    required: false
    default: 'docker'
  oidc_error_message:
    required: false
    default: 'keyless requires permissions id-token write in the calling workflow'
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        PLUGIN_IMAGE: ${{ inputs.plugin_image }}
        ENTRYPOINT: ${{ inputs.entrypoint }}
        COMMAND: ${{ inputs.command }}
        SOURCE_TYPE: ${{ inputs.source_type }}
      run: |
        set -euo pipefail
        if [ "${OIDC_PROVIDER:-}" = "non-harness" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "${{ inputs.oidc_error_message }}" >&2
            exit 1
          fi
          export PLUGIN_NON_HARNESS_OIDC_TOKEN="$(
            curl -sSf \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=harness-fulcio" | jq -r '.value'
          )"
        fi
        env_file="$(mktemp)"
        trap 'rm -f "$env_file"' EXIT
        env | grep -E '^(HARNESS_|GITHUB_|SBOM_|SLSA_|SIGNING_|SOURCE_|PLUGIN_|SSCA_|VAULT_|DOCKER_|ATTEST_|VERIFY_|POLICY_|REPO_|REGISTRY_|KMS_|ARTIFACT_|OIDC_|FULCIO_)' > "$env_file" || true
        run_args=(--rm -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" --env-file "$env_file" --entrypoint "${ENTRYPOINT}" "${PLUGIN_IMAGE}" "${COMMAND}")
        case "${SOURCE_TYPE}" in
          docker|image) docker run -v /var/run/docker.sock:/var/run/docker.sock "${run_args[@]}" ;;
          *) docker run "${run_args[@]}" ;;
        esac
