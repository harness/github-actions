name: 'Artifact Signing'
description: 'Github action to sign a given artifact'
author: 'Reetika Mallavarapu'
inputs:
  HARNESS_ACCOUNT_URL:
    required: true
  HARNESS_ACCOUNT_ID:
    required: true
  HARNESS_ORG_ID:
    required: true
  HARNESS_PROJECT_ID:
    required: true
  HARNESS_API_KEY:
    required: true
  SIGNING_SOURCE:
    description: 'Image or repo source'
    required: true
  KMS_KEY:
    required: false
  VAULT_ADDR:
    required: false
  VAULT_TOKEN:
    required: false
  OIDC_PROVIDER:
    required: false
  PLUGIN_IMAGE:
    default: 'harness/ssca-artifact-signing-plugin:0.69.0'
    required: false
  SOURCE_TYPE:
    default: 'docker'
    required: false
  DOCKER_USERNAME:
    required: false
  DOCKER_PASSWORD:
    required: false
runs:
  using: 'composite'
  steps:
    - name: Artifact Signing
      uses: ./run-plugin-container
      env:
        HARNESS_ACCOUNT_URL: ${{ inputs.HARNESS_ACCOUNT_URL }}
        HARNESS_ACCOUNT_ID: ${{ inputs.HARNESS_ACCOUNT_ID }}
        HARNESS_ORG_ID: ${{ inputs.HARNESS_ORG_ID }}
        HARNESS_PROJECT_ID: ${{ inputs.HARNESS_PROJECT_ID }}
        HARNESS_API_KEY: ${{ inputs.HARNESS_API_KEY }}
        SIGNING_SOURCE: ${{ inputs.SIGNING_SOURCE }}
        KMS_KEY: ${{ inputs.KMS_KEY }}
        VAULT_ADDR: ${{ inputs.VAULT_ADDR }}
        VAULT_TOKEN: ${{ inputs.VAULT_TOKEN }}
        OIDC_PROVIDER: ${{ inputs.OIDC_PROVIDER }}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
      with:
        PLUGIN_IMAGE: ${{ inputs.PLUGIN_IMAGE }}
        ENTRYPOINT: /bin/ssca-artifact-signing-plugin
        COMMAND: github-sign
        SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
