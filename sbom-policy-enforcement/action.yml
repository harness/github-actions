name: 'SBOM Policy Enforcement'
description: 'Github action to run SBOM Policy Enforcement'
author: 'Reetika Mallavarapu'
inputs:
  HARNESS_ACCOUNT_URL:
    description: 'Harness Account Url'
    required: true
  HARNESS_ACCOUNT_ID:
    description: 'Harness Account ID'
    required: true
  HARNESS_ORG_ID:
    description: 'Harness Organization ID'
    required: true
  HARNESS_PROJECT_ID:
    description: 'Harness Project ID'
    required: true
  HARNESS_API_KEY:
    description: 'Auth token for authentication with Harness'
    required: true
  SOURCE_TYPE:
    description: 'Source or registry type: docker, acr, gcr, ecr, gar, har, local, repository. Default docker.'
    required: false
    default: 'docker'
  SBOM_SOURCE:
    description: 'Image, file path, or repo identifier.'
    required: false
  VERIFY_SBOM:
    description: 'If verification is required'
    required: false
    default: 'true'
  POLICY_SET_REF:
    description: 'Policy Set Reference'
    required: false
  KMS_KEY:
    required: false
  VAULT_ADDR:
    required: false
  VAULT_TOKEN:
    required: false
  OIDC_PROVIDER:
    required: false
  ARTIFACT_WORKSPACE:
    required: false
  ARTIFACT_NAME:
    required: false
  ARTIFACT_VERSION:
    required: false
  DOCKER_USERNAME:
    required: false
  DOCKER_PASSWORD:
    required: false
runs:
  using: 'composite'
  steps:
    - name: SBOM Policy Enforcement
      uses: harness/github-actions/run-plugin-container@main
      env:
        ACTION_NAME: 'SBOM Policy Enforcement'
        HARNESS_ACCOUNT_URL: ${{ inputs.HARNESS_ACCOUNT_URL }}
        HARNESS_ACCOUNT_ID: ${{ inputs.HARNESS_ACCOUNT_ID }}
        HARNESS_ORG_ID: ${{ inputs.HARNESS_ORG_ID }}
        HARNESS_PROJECT_ID: ${{ inputs.HARNESS_PROJECT_ID }}
        HARNESS_API_KEY: ${{ inputs.HARNESS_API_KEY }}
        SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
        SBOM_SOURCE: ${{ inputs.SBOM_SOURCE }}
        VERIFY_SBOM: ${{ inputs.VERIFY_SBOM }}
        POLICY_SET_REF: ${{ inputs.POLICY_SET_REF }}
        KMS_KEY: ${{ inputs.KMS_KEY }}
        VAULT_ADDR: ${{ inputs.VAULT_ADDR }}
        VAULT_TOKEN: ${{ inputs.VAULT_TOKEN }}
        OIDC_PROVIDER: ${{ inputs.OIDC_PROVIDER }}
        ARTIFACT_WORKSPACE: ${{ inputs.ARTIFACT_WORKSPACE }}
        ARTIFACT_NAME: ${{ inputs.ARTIFACT_NAME }}
        ARTIFACT_VERSION: ${{ inputs.ARTIFACT_VERSION }}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
      with:
        PLUGIN_IMAGE: harness/ssca-plugin:0.69.0
        ENTRYPOINT: /bin/ssca-plugin
        COMMAND: github-enforce
